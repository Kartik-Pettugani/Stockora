services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockora
      POSTGRES_USER: stockora
      POSTGRES_PASSWORD: stockora
    ports:
      - "5432:5432"
    volumes:
      - stockora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockora -d stockora"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://stockora:stockora@postgres:5432/stockora
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  stockora-postgres-data:
