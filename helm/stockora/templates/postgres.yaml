apiVersion: v1
kind: Secret
metadata:
  name: stockora-postgres
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: stockora-postgres
spec:
  selector:
    app: stockora-postgres
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockora-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockora-postgres
  template:
    metadata:
      labels:
        app: stockora-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.postgres.database }}"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: stockora-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stockora-postgres
                  key: password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
        {{- if and .Values.postgres.persistence .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: stockora-postgres-data
        {{- else }}
          emptyDir: {}
        {{- end }}
{{- if and .Values.postgres.persistence .Values.postgres.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stockora-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
{{- end }}
