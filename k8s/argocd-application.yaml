apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockora
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Kartik-Pettugani/Stockora.git
    targetRevision: main
    path: helm/stockora
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: stockora
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
